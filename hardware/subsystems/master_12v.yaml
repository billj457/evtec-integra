  - - BATTERY: [1]
    - C_BATTERY_FEED: [1]
    - FUSED_ENGINE_BAY: [CH1_CABIN_FEED_125A]

  - - BATTERY: [2]
    - C_BATTERY_FEED: [2]
    - GROUND_ENGINE_BUS: [1]

  - - FUSED_ENGINE_BAY: [CH1_CABIN_FEED_125A]
