# WireViz - Front Under-Dash Blink Marine Keybox Harness
# 12-Pin Solid-State PDM (Under Dash / Cabin)

connectors:
  Front_Keybox:
    type: "Blink Marine Keybox / PDM (12-Pin Deutsch)"
    pincount: 11
    pinlabels: [12V, GND, CAN2_H, CAN2_L, CABIN_HTR_WAKE, CABIN_HTR_STG1, CABIN_HTR_STG2, AEM_KEYPAD, CD5_DASH_GAUGES, CAN_MODULES, EPS_WAKE]
    notes: "Front Under-Dash Power Distribution Module (12-Pin Deutsch)"

  POWER_SOURCE:
    type: "Dummy (Under-Dash Fused Block #2)"
    pincount: 2
    pinlabels: [12V_Ch2_60A, Ground_Busbar]

  CABIN_OUTPUTS:
    type: "Dummy (Cabin Actuators, Wakes and Instrumentation)"
    pincount: 7
    pinlabels: [CABIN_HTR_WAKE, CABIN_HTR_STG1, CABIN_HTR_STG2, AEM_KEYPAD, CD5_DASH_GAUGES, CAN_MODULES, EPS_WAKE]

cables:
  W_Power:
    wirecount: 2
    gauge: "20 AWG"
    colors: [RD, BK]
    notes: "12V Constant Main Power (Red) and Logic Ground Return (Black)"
 
  W_CAN2:
    wirecount: 2
    gauge: "20 AWG"
    colors: [YE, GN]
    notes: "CAN2 Bus Twisted Pair"

  W_Outputs:
    wirecount: 7
    gauge: "20 AWG"
    colors: [RD]
    notes: "20 AWG TXL Switched Power, Wake Triggers, and Logic Feeds"

connections:
  -
    - POWER_SOURCE: 1
    - W_Power: 1
    - Front_Keybox: 1
  -
    - POWER_SOURCE: 2
    - W_Power: 2
    - Front_Keybox: 2
  -
    - CAN2_BUS: [1, 2]
    - W_CAN2: [1, 2]
    - Front_Keybox: [3, 4]
  -
    - Front_Keybox: [5, 6, 7, 8, 9, 10, 11]
    - W_Outputs: [1, 2, 3, 4, 5, 6, 7]
    - CABIN_OUTPUTS: [1, 2, 3, 4, 5, 6, 7]